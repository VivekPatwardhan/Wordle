<main class="home-page">
  <app-header />
  
  <section class="mode-section" aria-label="Game Mode Selection">
    <div class="welcome-banner">
      <h2>Select Your Arena</h2>
      <p>Challenge your vocabulary in single player or sharpen your deduction strategy.</p>
    </div>

    <div class="modes-grid">
      <!-- Daily Challenge Card -->
      <button type="button" class="mode-card daily-card" (click)="dailyGame('daily')">
        <div class="mode-header">
          <div class="mode-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <span class="mode-tag tag-daily">DAILY PUZZLE</span>
        </div>
        <div class="mode-content">
          <h3 class="mode-title">Daily Challenge</h3>
          <p class="mode-desc">One curated puzzle every 24 hours. Protect your streak and test your word mastery.</p>
        </div>
        <div class="mode-action">
          <span>Play Today's Word</span>
          <span class="action-arrow">→</span>
        </div>
      </button>

      <!-- Practice Arena Card -->
      <button type="button" class="mode-card practice-card" (click)="practiceGame('practice')">
        <div class="mode-header">
          <div class="mode-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="6"></circle>
              <circle cx="12" cy="12" r="2"></circle>
            </svg>
          </div>
          <span class="mode-tag tag-practice">UNLIMITED</span>
        </div>
        <div class="mode-content">
          <h3 class="mode-title">Practice Arena</h3>
          <p class="mode-desc">Endless puzzles with zero pressure. Test opening words and hone your intuition.</p>
        </div>
        <div class="mode-action">
          <span>Start Practice Run</span>
          <span class="action-arrow">→</span>
        </div>
      </button>

      <!-- PvP Mode Card -->
      <button type="button" class="mode-card pvp-card" (click)="pvpGame()">
        <div class="mode-header">
          <div class="mode-icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
          </div>
          <span class="mode-tag tag-pvp">NEW</span>
        </div>
        <div class="mode-content">
          <h3 class="mode-title">PvP Duel</h3>
          <p class="mode-desc">Set a secret word for a friend, then swap roles. Most rounds won takes the duel. Or race towards a common puzzle.</p>
        </div>
        <div class="mode-action">
          <span>Challenge a Player</span>
          <span class="action-arrow">→</span>
        </div>
      </button>
    </div>
  </section>    

  <app-footer />
  <app-modal />
</main>
